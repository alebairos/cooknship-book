<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cooknship — Observe Kitchen</title>
  <style>
    :root { color-scheme: dark; --ink:#e9eee9; --muted:#829087; --line:#304238; --panel:#111a16; --accent:#a8d6b4; --hot:#f0c994; --good:#8bd8b0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink); background:radial-gradient(circle at 70% 0%,#22382d 0,#0b100e 46%,#080a09 100%); }
    main { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:36px 0 44px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:end; padding-bottom:26px; border-bottom:1px solid var(--line); }
    .eyebrow { color:var(--accent); letter-spacing:.18em; text-transform:uppercase; font-size:11px; }
    h1 { margin:8px 0 4px; font:500 clamp(30px,5vw,58px)/1.05 Georgia,serif; letter-spacing:-.04em; }
    .dek { margin:0; max-width:620px; color:#aebbb1; }
    .source { text-align:right; color:var(--muted); font-size:12px; }
    .source strong { display:block; color:var(--ink); font-weight:500; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:20px 0; }
    button { border:1px solid #53685a; color:var(--ink); background:#17241c; padding:9px 13px; border-radius:999px; cursor:pointer; font:inherit; font-size:12px; }
    button:hover { border-color:var(--accent); background:#203428; }
    input[type=range] { flex:1 1 260px; accent-color:var(--accent); min-width:180px; }
    .clock { min-width:150px; text-align:right; color:var(--hot); font-size:12px; }
    .kitchen { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:12px; padding:12px 0 22px; }
    .station { min-height:280px; position:relative; overflow:hidden; padding:14px; background:linear-gradient(180deg,#17231c,#0d1410); border:1px solid var(--line); border-radius:16px; transition:filter .25s, border-color .25s, transform .25s; }
    .station.active { border-color:var(--accent); filter:brightness(1.18); }
    .station::after { content:""; position:absolute; inset:auto 14px 14px; height:2px; background:var(--line); }
    .station.heartbeat .station-lamp { animation:pulse .8s ease-in-out infinite alternate; box-shadow:0 0 0 5px #8bd8b022,0 0 24px #8bd8b077; }
    .station-head { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
    .station-lamp { width:9px; height:9px; border-radius:50%; background:var(--good); transition:opacity .3s; }
    .station:not(.active) .station-lamp { opacity:.28; }
    .sprite { display:grid; place-items:center; height:88px; margin:18px 0 12px; color:#243d2b; font-size:48px; }
    .station:nth-child(1) .sprite::before { content:"✎"; } .station:nth-child(2) .sprite::before { content:"♨"; } .station:nth-child(3) .sprite::before { content:"⌕"; } .station:nth-child(4) .sprite::before { content:"✓"; } .station:nth-child(5) .sprite::before { content:"→"; }
    .tokens { display:flex; flex-wrap:wrap; gap:7px; align-content:flex-start; }
    .token { display:inline-flex; align-items:center; gap:5px; padding:6px 8px; border-radius:8px; color:#17251c; background:var(--accent); font-size:11px; font-weight:700; box-shadow:0 5px 15px #0005; animation:float-in .25s ease-out; }
    .token small { opacity:.62; font-weight:500; }
    .token.expired { background:#d48a8a; color:#2a0f0f; }
    .empty { color:#5e6d63; font-size:11px; padding-top:8px; }
    .scores { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .score { background:#111a16; padding:15px 16px; } .score label { display:block; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.12em; } .score strong { display:block; margin-top:5px; font:500 24px Georgia,serif; color:var(--hot); }
    .note { margin-top:20px; color:#748178; font-size:11px; }
    .note a { color:var(--accent); text-decoration:underline; }
    .banner { color:var(--hot); background:#3a1c1c; border:1px solid #a85a5a; padding:8px 12px; border-radius:8px; margin-top:8px; font-size:12px; }
    .banner.hidden { display:none; }
    @keyframes pulse { from { transform:scale(.8); opacity:.45; } to { transform:scale(1.2); opacity:1; } }
    @keyframes float-in { from { opacity:0; transform:translateY(5px) scale(.92); } to { opacity:1; transform:none; } }
    @media (max-width:800px) { header { display:block; } .source { text-align:left; margin-top:16px; } .kitchen { grid-template-columns:repeat(2,minmax(140px,1fr)); } .station:last-child { grid-column:span 2; min-height:180px; } .scores { grid-template-columns:repeat(2,1fr); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms !important; transition:none !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Observe / Cooknship</div><h1>Kitchen at work.</h1><p class="dek">A live replay of the factory’s beats. Plates follow their latest station; the room brightens when history is still warm.</p></div>
      <div class="source"><strong id="status">Loading…</strong><span id="event-count">0 events</span><div id="banner" class="banner hidden" role="status">Host unreachable</div></div>
    </header>
    <section class="toolbar" aria-label="Replay controls">
      <button id="play" type="button">Play</button><button id="step-back" type="button" aria-label="Step backward">←</button><button id="step-forward" type="button" aria-label="Step forward">→</button>
      <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="Replay position"><span class="clock" id="clock">No tape</span>
    </section>
    <section id="kitchen" class="kitchen" aria-label="Kitchen stations"></section>
    <section class="scores" aria-label="Read-only score strip">
      <div class="score"><label>Reviewer pass</label><strong id="reviewer-pass">0/0</strong></div><div class="score"><label>Walk yield</label><strong id="walk-yield">0/0</strong></div><div class="score"><label>Inbox badges</label><strong id="inbox-count">0</strong></div><div class="score"><label>Tickets visible</label><strong id="ticket-count">0</strong></div>
    </section>
    <p class="note"><a href="/descriptor">Route/schema descriptor</a> · live projection only · no writes.</p>
  </main>
  <script>
    const stations = [['spec','Spec'],['doing','Doing'],['review','Review'],['done','Done'],['ship','Ship']];
    const stationForKind = { claim: 'doing', renew: 'doing', close: 'done', 'mark-ready': 'spec', expire: 'spec', upsert: 'spec' };
    const state = { events: [], index: 0, playing: false, timer: null, lastSeq: 0, host: '', token: '', pollHandle: null };
    const $ = (id) => document.getElementById(id);
    function stationFor(event) { return stationForKind[event.kind] || 'doing'; }
    function parsePayload(event) {
      try {
        if (event.payload && typeof event.payload === 'string') return JSON.parse(event.payload);
        if (event.payload && typeof event.payload === 'object') return event.payload;
      } catch (e) {}
      return {};
    }
    function wiFor(event) { const p = parsePayload(event); return p.wiId || event.wi || ''; }
    function render() {
      const events = state.events.slice(0, state.index + 1), latest = new Map();
      events.forEach(event => { const wi = wiFor(event); if (wi) latest.set(wi, event); });
      const recentTs = events.length ? events[events.length - 1].ts : 0, windowMs = 1000 * 60 * 60 * 24 * 7;
      $('kitchen').innerHTML = stations.map(([key,label]) => {
        const activeEvents = events.filter(event => stationFor(event) === key), live = activeEvents.some(event => recentTs - event.ts <= windowMs);
        const tokens = [...latest.values()].filter(event => stationFor(event) === key).map(event => {
          const expired = event.kind === 'expire' ? ' expired' : '';
          return `<span class="token${expired}">${wiFor(event)}<small>${event.kind}</small></span>`;
        }).join('');
        return `<article class="station ${activeEvents.length ? 'active' : ''} ${live ? 'heartbeat' : ''}"><div class="station-head"><span>${label}</span><i class="station-lamp"></i></div><div class="sprite" aria-hidden="true"></div><div class="tokens">${tokens || '<span class="empty">quiet</span>'}</div></article>`;
      }).join('');
      const checks = events.filter(event => event.kind === 'check.pass' || event.kind === 'check.fail'), walks = events.filter(event => event.kind === 'walk.pass' || event.kind === 'walk.fail');
      $('reviewer-pass').textContent = `${checks.filter(event => event.kind === 'check.pass').length}/${checks.length}`;
      $('walk-yield').textContent = `${walks.filter(event => event.kind === 'walk.pass').length}/${walks.length}`;
      $('inbox-count').textContent = events.filter(event => event.inbox || (event.kind && event.kind.startsWith('inbox.'))).length;
      $('ticket-count').textContent = latest.size;
      $('event-count').textContent = `${state.events.length} events · ${latest.size} tickets`;
      $('clock').textContent = events.length ? new Date(events[events.length - 1].ts).toISOString().replace('T',' ').slice(0,16) + 'Z' : 'No tape';
      $('scrub').value = state.index;
    }
    function setIndex(index) { state.index = Math.max(0, Math.min(Number(index), Math.max(0, state.events.length - 1))); render(); }
    function play() { if (!state.events.length) return; state.playing = !state.playing; $('play').textContent = state.playing ? 'Pause' : 'Play'; clearInterval(state.timer); if (state.playing) state.timer = setInterval(() => { if (state.index >= state.events.length - 1) { state.playing = false; $('play').textContent = 'Play'; clearInterval(state.timer); return; } setIndex(state.index + 1); }, 420); }
    function showBanner(message) { $('banner').textContent = message; $('banner').classList.remove('hidden'); $('status').textContent = 'Disconnected'; }
    function hideBanner() { $('banner').classList.add('hidden'); $('status').textContent = 'Polling live events'; }
    function promptToken() { const value = window.prompt('Enter bearer token for cooknship-book'); if (value) { state.token = value; localStorage.setItem('cooknship-book-token', value); } }
    async function poll() {
      if (!state.host || !state.token) { showBanner('Missing host or token'); return; }
      try {
        const response = await fetch(`/host/${state.host}/events?since=${state.lastSeq}`, { headers: { 'Authorization': `Bearer ${state.token}` } });
        if (response.status === 401) { promptToken(); return; }
        if (!response.ok) { showBanner(`Host unreachable (${response.status})`); return; }
        const batch = await response.json();
        if (batch.length) {
          state.events = state.events.concat(batch);
          state.lastSeq = Math.max(state.lastSeq, ...batch.map(e => e.seq || 0));
          state.index = state.events.length - 1;
          $('scrub').max = state.index;
        }
        hideBanner();
        render();
      } catch (error) {
        showBanner('Host unreachable');
      }
    }
    function start() {
      const params = new URLSearchParams(location.search);
      state.host = params.get('host') || '';
      const pollMs = Number(params.get('pollMs')) || 2000;
      state.token = localStorage.getItem('cooknship-book-token') || '';
      if (!state.token) promptToken();
      if (!state.host) { showBanner('No ?host= in URL'); render(); return; }
      $('status').textContent = 'Polling live events';
      state.pollHandle = setInterval(poll, pollMs);
      poll();
    }
    $('play').addEventListener('click', play); $('step-back').addEventListener('click', () => setIndex(state.index - 1)); $('step-forward').addEventListener('click', () => setIndex(state.index + 1)); $('scrub').addEventListener('input', event => setIndex(event.target.value));
    start();
  </script>
</body>
</html>
